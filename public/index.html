<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaker - Your Personal Note Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --panel-bg: rgba(255, 255, 255, 0.95);
            --text-color: #333;
            --text-muted: #666;
            --text-faint: #999;
            --input-bg: #fff;
            --input-border: #e1e5e9;
            --item-bg: #f8f9fa;
            --item-border: transparent;
            --code-bg: #f4f2ff;
        }

        [data-color-scheme="dark"] {
            --panel-bg: rgba(30, 32, 40, 0.95);
            --text-color: #e8e8ec;
            --text-muted: #a8a8b3;
            --text-faint: #77778a;
            --input-bg: #2a2c38;
            --input-border: #43465a;
            --item-bg: #262832;
            --item-border: #34364400;
            --code-bg: #2b2740;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--app-bg, linear-gradient(135deg, #667eea 0%, #764ba2 100%));
            min-height: 100vh;
            color: var(--text-color);
            transition: background 0.4s ease, color 0.2s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: relative;
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .theme-picker {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-swatch {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 0;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .theme-swatch:hover {
            transform: scale(1.15);
        }

        .theme-swatch.active {
            border-color: white;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 640px) {
            .theme-picker {
                position: static;
                justify-content: center;
                margin-top: 10px;
            }
        }

        .color-scheme-toggle {
            position: absolute;
            top: 0;
            left: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .color-scheme-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 640px) {
            .color-scheme-toggle {
                position: static;
                margin-bottom: 10px;
            }
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            flex: 1;
        }

        .sidebar {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            height: fit-content;
            min-width: 0; /* allow flex children to shrink instead of overflowing */
            transition: background 0.2s ease;
        }

        .note-editor {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            min-width: 0; /* prevent long unbroken text from forcing this wider */
            transition: background 0.2s ease;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease, background 0.2s ease, color 0.2s ease;
            background: var(--input-bg);
            color: var(--text-color);
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
            overflow-x: hidden; /* never show a horizontal scrollbar here */
        }

        .note-item {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            margin: 0 5px 10px 0; /* right margin gives room for the hover shift below */
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--item-bg);
        }

        .note-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .note-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .note-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: var(--text-color);
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .note-preview {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere; /* handle very long unbroken text (e.g. URLs) */
            word-break: break-word;
        }

        .note-date {
            font-size: 12px;
            color: var(--text-faint);
            margin-top: 5px;
        }

        .note-item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .mini-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--code-bg);
            color: #4b3fa0;
        }

        [data-color-scheme="dark"] .mini-tag {
            color: #c9b8ff;
        }

        .editor-header {
            /* Title and actions always sit on their own row, each full-width.
               (Previously title+actions shared one flex-wrap row, so whether
               they fit side-by-side depended on the actions row's current
               content width - e.g. a new note has no Delete button and fits,
               but a saved note's extra Delete button doesn't, so the same
               header would wrap differently depending on note state. Same
               root cause made the Translate button's label growing to
               "Translating..." push the row over the edge mid-click.
               Stacking unconditionally removes that content-width-dependent
               flakiness entirely.) */
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 20px;
        }

        .editor-title {
            font-size: 1.5rem;
            color: var(--text-color);
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .editor-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #28a745;
            color: white;
            /* Fixed width sized for the longer "Saving..." label, so the
               label swap while saving doesn't reflow the row. */
            min-width: 110px;
            white-space: nowrap;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-translate {
            background: #6c5ce7;
            color: white;
            /* Fixed width sized for the longer "Translating..." label, so
               swapping the label doesn't reflow the whole editor-actions row. */
            min-width: 132px;
            white-space: nowrap;
        }

        .btn-translate:hover {
            background: #5a4bd1;
            transform: translateY(-1px);
        }

        .btn-translate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-attach {
            background: #20c997;
            color: white;
            /* Fixed width sized for the longer "Add attachment" label, so
               swapping to "Uploading..." doesn't shrink/reflow the row. */
            min-width: 150px;
            white-space: nowrap;
        }

        .btn-attach:hover {
            background: #199d76;
            transform: translateY(-1px);
        }

        .btn-attach:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-export {
            background: #495057;
            color: white;
        }

        .btn-export:hover {
            background: #383d41;
            transform: translateY(-1px);
        }

        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            background: var(--code-bg);
            color: #4b3fa0;
            font-size: 13px;
            font-weight: 600;
        }

        [data-color-scheme="dark"] .tag-chip {
            color: #c9b8ff;
        }

        .tag-chip .tag-remove {
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
            font-size: 13px;
            line-height: 1;
            padding: 0;
            opacity: 0.7;
        }

        .tag-chip .tag-remove:hover {
            opacity: 1;
        }

        .tag-input {
            font-size: 14px !important;
            padding: 8px 12px !important;
        }

        .tag-filter-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tag-filter-chip {
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid var(--input-border);
            background: var(--item-bg);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tag-filter-chip:hover {
            border-color: #667eea;
        }

        .tag-filter-chip.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        .attachments-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .attachment-item {
            position: relative;
            width: 90px;
        }

        .attachment-item .attachment-thumb {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--input-border);
            display: block;
            background: var(--item-bg);
        }

        .attachment-item .attachment-file-icon {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--item-bg);
            border-radius: 8px;
            border: 2px solid var(--input-border);
            font-size: 32px;
        }

        .attachment-item a {
            text-decoration: none;
            color: inherit;
        }

        .attachment-item .attachment-filename {
            font-size: 11px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 4px;
            color: var(--text-muted);
        }

        .attachment-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            padding: 0;
        }

        .attachment-remove:hover {
            background: #c82333;
        }

        .translate-language-select {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .translation-panel {
            margin-top: 16px;
            padding: 16px;
            border-radius: 10px;
            background: var(--code-bg);
            border: 1px solid #d8d0ff;
            color: var(--text-color);
        }

        .translation-panel h4 {
            margin-bottom: 8px;
            color: #4b3fa0;
        }

        .translation-panel .translated-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .translation-panel .translated-content {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .translation-panel .close-translation {
            float: right;
            cursor: pointer;
            color: #6c5ce7;
            font-weight: 600;
            background: none;
            border: none;
            font-size: 14px;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease, background 0.2s ease, color 0.2s ease;
            background: var(--input-bg);
            color: var(--text-color);
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease, background 0.2s ease, color 0.2s ease;
            line-height: 1.6;
            overflow-wrap: anywhere; /* break long unbroken words instead of overflowing */
            word-break: break-word;
            background: var(--input-bg);
            color: var(--text-color);
        }

        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 12px;
            border: 3px solid var(--input-border);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="color-scheme-toggle" id="colorSchemeToggle" title="Toggle dark mode">🌙</button>
            <h1>📝 NoteTaker</h1>
            <p>Organize your thoughts, capture your ideas</p>
            <div class="theme-picker" id="themePicker" title="Background theme"></div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes...">
                <button class="new-note-btn" id="newNoteBtn">✨ New Note</button>
                <div class="tag-filter-list" id="tagFilterList"></div>

                <div class="notes-list" id="notesList">
                    <div class="loading-state" id="notesLoadingState">
                        <div class="spinner"></div>
                        <p>Loading notes...</p>
                    </div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <select class="translate-language-select" id="translateLanguage">
                            <option value="Chinese (Simplified)" selected>中文（简体）</option>
                            <option value="Chinese (Traditional)">中文（繁體）</option>
                            <option value="English">English</option>
                            <option value="Spanish">Español</option>
                            <option value="Japanese">日本語</option>
                            <option value="French">Français</option>
                        </select>
                        <button class="btn btn-translate" id="translateBtn">🌐 Translate</button>
                        <button class="btn btn-save" id="saveBtn">💾 Save</button>
                        <button class="btn btn-export" id="exportBtn">⬇️ Export</button>
                        <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
                    </div>
                </div>

                <div id="messageArea"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title... (leave blank and AI will suggest one)">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea class="form-textarea" id="noteContent" placeholder="Start writing your note..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tags</label>
                        <div class="tags-list" id="tagsList"></div>
                        <input type="text" class="form-input tag-input" id="tagInput" placeholder="Add a tag and press Enter...">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Attachments</label>
                        <div class="attachments-list" id="attachmentsList"></div>
                        <input type="file" id="attachmentInput" accept="image/*,.pdf,.txt,.doc,.docx" style="display: none;">
                        <button class="btn btn-attach" id="attachBtn">📎 Add attachment</button>
                    </div>

                    <div class="translation-panel" id="translationPanel" style="display: none;">
                        <button class="close-translation" id="closeTranslationBtn">✕ Close</button>
                        <h4 id="translationHeading">Translation</h4>
                        <div class="translated-title" id="translatedTitle"></div>
                        <div class="translated-content" id="translatedContent"></div>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.isLoading = false;
                this.searchQuery = '';
                this.activeTagFilter = null;
                this.init();
            }

            async init() {
                this.bindEvents();
                this.initThemePicker();
                this.initColorScheme();
                await this.loadNotes();
            }

            // --- Background theme picker -------------------------------------------------
            // A small feature to change the app's background color/gradient.
            // The chosen theme is persisted in localStorage so it survives reloads.
            static THEMES = [
                { id: 'purple', label: 'Purple (default)', bg: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' },
                { id: 'ocean', label: 'Ocean Blue', bg: 'linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%)' },
                { id: 'sunset', label: 'Sunset', bg: 'linear-gradient(135deg, #ff6a00 0%, #ee0979 100%)' },
                { id: 'forest', label: 'Forest', bg: 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)' },
                { id: 'midnight', label: 'Midnight', bg: 'linear-gradient(135deg, #232526 0%, #414345 100%)' },
            ];

            initThemePicker() {
                const picker = document.getElementById('themePicker');
                const savedThemeId = localStorage.getItem('notetaker-theme') || 'purple';

                picker.innerHTML = NoteTaker.THEMES.map(theme => `
                    <button class="theme-swatch ${theme.id === savedThemeId ? 'active' : ''}"
                            style="background: ${theme.bg}"
                            data-theme-id="${theme.id}"
                            aria-label="${this.escapeHtml(theme.label)}"
                            title="${this.escapeHtml(theme.label)}"></button>
                `).join('');

                picker.querySelectorAll('.theme-swatch').forEach(btn => {
                    btn.addEventListener('click', () => this.applyTheme(btn.dataset.themeId, true));
                });

                this.applyTheme(savedThemeId, false);
            }

            applyTheme(themeId, persist) {
                const theme = NoteTaker.THEMES.find(t => t.id === themeId) || NoteTaker.THEMES[0];
                document.documentElement.style.setProperty('--app-bg', theme.bg);

                document.querySelectorAll('.theme-swatch').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.themeId === theme.id);
                });

                if (persist) {
                    localStorage.setItem('notetaker-theme', theme.id);
                }
            }

            // --- Dark mode -----------------------------------------------------------
            // Separate from the background theme picker above: this actually
            // switches the app's panels/inputs/text between a light and a dark
            // palette (via CSS variables + [data-color-scheme="dark"]), rather
            // than just changing the decorative outer gradient.
            initColorScheme() {
                const saved = localStorage.getItem('notetaker-color-scheme') || 'light';
                this.applyColorScheme(saved);
            }

            applyColorScheme(scheme) {
                document.documentElement.setAttribute('data-color-scheme', scheme);
                document.getElementById('colorSchemeToggle').textContent = scheme === 'dark' ? '☀️' : '🌙';
                localStorage.setItem('notetaker-color-scheme', scheme);
            }

            toggleColorScheme() {
                const current = document.documentElement.getAttribute('data-color-scheme') || 'light';
                this.applyColorScheme(current === 'dark' ? 'light' : 'dark');
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateNote());
                document.getElementById('closeTranslationBtn').addEventListener('click', () => this.hideTranslation());
                document.getElementById('attachBtn').addEventListener('click', () => this.handleAttachClick());
                document.getElementById('attachmentInput').addEventListener('change', (e) => this.uploadAttachment(e.target.files[0]));
                document.getElementById('exportBtn').addEventListener('click', () => this.exportNote());
                document.getElementById('colorSchemeToggle').addEventListener('click', () => this.toggleColorScheme());
                document.getElementById('tagInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.addTag(e.target.value);
                        e.target.value = '';
                    }
                });
                document.getElementById('searchBox').addEventListener('input', (e) => {
                    this.searchQuery = e.target.value;
                    this.applyFilters();
                });
                
                // Auto-save on content change (debounced)
                let saveTimeout;
                const autoSave = () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        if (this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', autoSave);
            }

            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            // Re-renders the sidebar list from this.notes, applying whatever
            // search text / tag filter are currently active. Replaces what
            // used to be two separate, near-duplicate render paths (plain
            // list vs. search results).
            renderNotesList() {
                this.applyFilters();
            }

            applyFilters() {
                let filtered = this.notes;

                const query = (this.searchQuery || '').trim().toLowerCase();
                if (query) {
                    filtered = filtered.filter(note =>
                        (note.title && note.title.toLowerCase().includes(query)) ||
                        (note.content && note.content.toLowerCase().includes(query))
                    );
                }

                if (this.activeTagFilter) {
                    filtered = filtered.filter(note => (note.tags || []).includes(this.activeTagFilter));
                }

                this.renderTagFilterList();
                this.renderNoteItems(filtered);
            }

            renderNoteItems(notes) {
                const notesList = document.getElementById('notesList');

                if (notes.length === 0) {
                    const hasAnyNotes = this.notes.length > 0;
                    notesList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">${hasAnyNotes ? '🔍' : '🗒️'}</div>
                            <p>${hasAnyNotes ? 'No notes match your search/filter.' : 'No notes yet. Create your first note!'}</p>
                        </div>`;
                    return;
                }

                notesList.innerHTML = notes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}"
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        ${(note.tags && note.tags.length) ? `<div class="note-item-tags">${note.tags.map(t => `<span class="mini-tag">${this.escapeHtml(t)}</span>`).join('')}</div>` : ''}
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            renderTagFilterList() {
                const container = document.getElementById('tagFilterList');
                const allTags = [...new Set(this.notes.flatMap(n => n.tags || []))].sort();

                if (allTags.length === 0) {
                    container.innerHTML = '';
                    return;
                }

                container.innerHTML = allTags.map(tag => `
                    <button class="tag-filter-chip ${this.activeTagFilter === tag ? 'active' : ''}"
                            data-tag="${this.escapeHtml(tag)}">${this.escapeHtml(tag)}</button>
                `).join('');

                container.querySelectorAll('.tag-filter-chip').forEach(btn => {
                    btn.addEventListener('click', () => this.toggleTagFilter(btn.dataset.tag));
                });
            }

            toggleTagFilter(tag) {
                this.activeTagFilter = this.activeTagFilter === tag ? null : tag;
                this.applyFilters();
            }

            async selectNote(noteId) {
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state

                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('editorTitle').textContent = note.title || 'Untitled Note';
                this.updateDeleteButtonVisibility();
                this.hideTranslation();
                this.renderAttachments(note.attachments || []);
                this.renderTags(note.tags || []);
            }

            createNewNote() {
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    attachments: [],
                    tags: []
                };

                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('editorTitle').textContent = 'New Note';
                document.getElementById('noteTitle').focus();
                this.updateDeleteButtonVisibility();
                this.hideTranslation();
                this.renderAttachments([]);
                this.renderTags([]);

                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';
            }

            // The delete button should only be visible for notes that have
            // already been saved (i.e. have an id). A new, unsaved note has
            // nothing to delete yet.
            updateDeleteButtonVisibility() {
                const deleteBtn = document.getElementById('deleteBtn');
                const hasSavedNote = !!(this.currentNote && this.currentNote.id);
                deleteBtn.style.display = hasSavedNote ? 'inline-block' : 'none';
            }

            // Notes need an id (i.e. must exist in the DB) before a translation
            // or an attachment can be linked to them. Rather than making the
            // user click Save first, silently save-as-you-go: auto-save a new
            // note here, and only bother the user if there's truly nothing to
            // save yet (blank title and content).
            async ensureNoteSaved(actionLabel) {
                if (!this.currentNote) return false;
                if (this.currentNote.id) return true;

                await this.saveNote(true);

                if (!this.currentNote || !this.currentNote.id) {
                    this.showMessage(`Please enter a title or content before ${actionLabel}`, 'error');
                    return false;
                }
                return true;
            }

            async translateNote() {
                if (!(await this.ensureNoteSaved('translating'))) return;

                const targetLanguage = document.getElementById('translateLanguage').value;
                const translateBtn = document.getElementById('translateBtn');
                translateBtn.disabled = true;
                translateBtn.textContent = '🌐 Translating...';

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}/translate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target_language: targetLanguage })
                    });

                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error || 'Failed to translate note');
                    }

                    this.showTranslation(result);
                    this.hideMessage(); // clear any stale error (e.g. from an earlier blank-note attempt)
                } catch (error) {
                    this.showMessage(`Error translating note: ${error.message}`, 'error');
                } finally {
                    translateBtn.disabled = false;
                    translateBtn.textContent = '🌐 Translate';
                }
            }

            showTranslation(result) {
                document.getElementById('translationHeading').textContent =
                    `Translation (${result.target_language})`;
                document.getElementById('translatedTitle').textContent = result.translated_title;
                document.getElementById('translatedContent').textContent = result.translated_content;
                document.getElementById('translationPanel').style.display = 'block';
            }

            hideTranslation() {
                document.getElementById('translationPanel').style.display = 'none';
            }

            hideEditor() {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = 'Select a note to edit';
                this.currentNote = null;
                this.hideTranslation();
                this.renderAttachments([]);
                this.renderTags([]);
            }

            async handleAttachClick() {
                if (!(await this.ensureNoteSaved('adding an attachment'))) return;
                document.getElementById('attachmentInput').click();
            }

            async uploadAttachment(file) {
                if (!file || !this.currentNote || !this.currentNote.id) return;

                const attachBtn = document.getElementById('attachBtn');
                const attachmentInput = document.getElementById('attachmentInput');
                attachBtn.disabled = true;
                attachBtn.textContent = '📎 Uploading...';

                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const response = await fetch(`/api/notes/${this.currentNote.id}/attachments`, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error || 'Failed to upload attachment');
                    }

                    this.currentNote.attachments = this.currentNote.attachments || [];
                    this.currentNote.attachments.push(result);
                    this.renderAttachments(this.currentNote.attachments);
                    this.hideMessage(); // clear any stale error (e.g. from an earlier blank-note attempt)

                    // Keep this.notes in sync so re-selecting the note still shows it
                    const noteInList = this.notes.find(n => n.id === this.currentNote.id);
                    if (noteInList) noteInList.attachments = this.currentNote.attachments;
                } catch (error) {
                    this.showMessage(`Error uploading attachment: ${error.message}`, 'error');
                } finally {
                    attachBtn.disabled = false;
                    attachBtn.textContent = '📎 Add attachment';
                    attachmentInput.value = ''; // allow re-selecting the same file later
                }
            }

            async deleteAttachmentItem(attachmentId) {
                if (!confirm('Remove this attachment?')) return;

                try {
                    const response = await fetch(`/api/attachments/${attachmentId}`, { method: 'DELETE' });
                    if (!response.ok) {
                        const result = await response.json().catch(() => ({}));
                        throw new Error(result.error || 'Failed to remove attachment');
                    }

                    this.currentNote.attachments = (this.currentNote.attachments || [])
                        .filter(a => a.id !== attachmentId);
                    this.renderAttachments(this.currentNote.attachments);

                    const noteInList = this.notes.find(n => n.id === this.currentNote.id);
                    if (noteInList) noteInList.attachments = this.currentNote.attachments;
                } catch (error) {
                    this.showMessage(`Error removing attachment: ${error.message}`, 'error');
                }
            }

            renderAttachments(attachments) {
                const list = document.getElementById('attachmentsList');
                const isImage = (contentType) => contentType && contentType.startsWith('image/');

                list.innerHTML = (attachments || []).map(a => `
                    <div class="attachment-item">
                        <button class="attachment-remove" title="Remove"
                                onclick="noteTaker.deleteAttachmentItem(${a.id})">✕</button>
                        <a href="${a.url}" target="_blank" rel="noopener noreferrer">
                            ${isImage(a.content_type)
                                ? `<img class="attachment-thumb" src="${a.url}" alt="${this.escapeHtml(a.filename)}">`
                                : `<div class="attachment-file-icon">📄</div>`}
                        </a>
                        <div class="attachment-filename" title="${this.escapeHtml(a.filename)}">${this.escapeHtml(a.filename)}</div>
                    </div>
                `).join('');
            }

            // --- Tags ------------------------------------------------------------------
            renderTags(tags) {
                const list = document.getElementById('tagsList');
                list.innerHTML = (tags || []).map(tag => `
                    <span class="tag-chip" data-tag="${this.escapeHtml(tag)}">
                        ${this.escapeHtml(tag)}
                        <button class="tag-remove" title="Remove tag">✕</button>
                    </span>
                `).join('');

                list.querySelectorAll('.tag-chip').forEach(chip => {
                    chip.querySelector('.tag-remove').addEventListener('click', () => this.removeTag(chip.dataset.tag));
                });
            }

            addTag(rawTag) {
                if (!this.currentNote) return;
                const tag = rawTag.trim().toLowerCase();
                if (!tag) return;

                this.currentNote.tags = this.currentNote.tags || [];
                if (this.currentNote.tags.includes(tag)) return;

                this.currentNote.tags.push(tag);
                this.renderTags(this.currentNote.tags);
                this.persistTagsIfSaved();
            }

            removeTag(tag) {
                if (!this.currentNote) return;
                this.currentNote.tags = (this.currentNote.tags || []).filter(t => t !== tag);
                this.renderTags(this.currentNote.tags);
                this.persistTagsIfSaved();
            }

            // Tags on an already-saved note are persisted right away (same
            // spirit as attachments); on a brand-new note they just live in
            // memory until the note itself is first saved, at which point
            // saveNote() includes whatever tags have been added so far.
            async persistTagsIfSaved() {
                if (this.currentNote && this.currentNote.id) {
                    await this.saveNote(true);
                }
            }

            // --- Export ------------------------------------------------------------------
            exportNote() {
                if (!this.currentNote) return;

                const title = document.getElementById('noteTitle').value.trim() || this.currentNote.title || 'Untitled';
                const content = document.getElementById('noteContent').value || this.currentNote.content || '';
                const tags = this.currentNote.tags || [];

                let markdown = `# ${title}\n`;
                if (tags.length) {
                    markdown += `\nTags: ${tags.map(t => `#${t}`).join(' ')}\n`;
                }
                markdown += `\n${content}\n`;

                const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const filename = (title.replace(/[^\w\-]+/g, '_').toLowerCase() || 'note').slice(0, 60);

                const link = document.createElement('a');
                link.href = url;
                link.download = `${filename}.md`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote) return;

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return;
                }

                const saveBtn = document.getElementById('saveBtn');
                if (!isAutoSave) {
                    saveBtn.disabled = true;
                    saveBtn.textContent = '💾 Saving...';
                }

                try {
                    const noteData = {
                        // Send the title as-is, even blank - a blank title on a
                        // brand-new note (with real content) is what tells the
                        // backend to have an LLM suggest one, instead of just
                        // defaulting to "Untitled" here on the client.
                        title: title,
                        content: content,
                        tags: this.currentNote.tags || []
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    document.getElementById('noteTitle').value = savedNote.title || '';
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    this.updateDeleteButtonVisibility();
                    this.renderAttachments(savedNote.attachments || []);
                    this.renderTags(savedNote.tags || []);

                    if (!isAutoSave) {
                        if (savedNote.ai_generated_title) {
                            this.showMessage(
                                `✨ AI suggested a title${(savedNote.tags || []).length ? ' and tags' : ''} for you: "${this.escapeHtml(savedNote.title)}"`,
                                'success'
                            );
                        } else {
                            this.showMessage('Note saved successfully!', 'success');
                        }
                    }
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                } finally {
                    if (!isAutoSave) {
                        saveBtn.disabled = false;
                        saveBtn.textContent = '💾 Save';
                    }
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm('Are you sure you want to delete this note?')) return;

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                }
            }


            showMessage(message, type) {
                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = `<div class="${type}">${message}</div>`;
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
